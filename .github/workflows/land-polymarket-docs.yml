name: land polymarket docs
on:
  push:
    paths:
      - .github/workflows/land-polymarket-docs.yml
permissions:
  contents: write
jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/polymarket-clob-f004
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: patch owner guides and remove this workflow
        run: |
          git apply --whitespace=nowarn << 'PATCH'
          diff --git a/docs/alice-harness.md b/docs/alice-harness.md
          --- a/docs/alice-harness.md
          +++ b/docs/alice-harness.md
          @@ -26,7 +26,8 @@ accepted and available revisions separately.
           
           `ALICE_HARNESS_SKILLS` in `src/workspaces/alice-harness-policy.ts` is the
           authoritative catalog of complete Alice-owned Skill trees, including the
          -`market-data` raw-history capability. The legacy catalog additionally covers
          +`market-data` raw-history capability and the `polymarket` public CLOB
          +discovery, quote, and plan-only order capability. The legacy catalog additionally covers
           removal/reconciliation of `alice-workspace` copies. `.agents/skills` is primary
           and `.claude/skills` is its runtime mirror; old `.pi/skills` duplicates are
           included only for reconciliation. Template-declared instructions, README and
          diff --git a/docs/market-data-architecture.md b/docs/market-data-architecture.md
          --- a/docs/market-data-architecture.md
          +++ b/docs/market-data-architecture.md
          @@ -267,6 +267,20 @@ The chart displays exclusions separately from freshness; neither CLI nor UI
           substitutes a quote or switches sources to manufacture a complete candle.
           Diagnostics describe rows reaching the bar service, not invisible upstream gaps.
           
          +## Polymarket
          +
          +Polymarket is not a bar vendor and not a Broker Pack. `src/domain/polymarket/`
          +reads the public Gamma API for discovery and the public CLOB book for quotes.
          +`alice polymarket select` drops markets whose book is one-sided, wider than the
          +spread cap, or thinner than the near-touch depth floor. v1 outcomes are quoted
          +by CLOB token id; v2 outcomes are quoted by position id.
          +
          +`alice polymarket plan` checks tick size, minimum size, post-only crossing, and
          +FOK/FAK depth, then returns 6-decimal maker and taker amounts. The default
          +client has no order submitter, so a plan is not POSTed to `clob.polymarket.com`.
          +A submitter has to be injected by the caller and still receives only the
          +economic order. OpenAlice does not store Polymarket credentials for this path.
          +
           ## Market references in replies
           
           `[[market/{barId}/{interval}]]` is a reserved Connector Protocol reference,
          diff --git a/docs/project-structure.md b/docs/project-structure.md
          --- a/docs/project-structure.md
          +++ b/docs/project-structure.md
          @@ -72,7 +72,8 @@ src/                           Alice process
           │   ├── market-data/           market/fundamental data access
           │   ├── analysis/              indicators and technical analysis
           │   ├── news/                  RSS collection and archive search
          -│   └── thinking/              safe expression evaluation
          +│   ├── thinking/              safe expression evaluation
          +│   └── polymarket/            public Gamma discovery, CLOB books, and plan-only orders
           ├── tool/                      agent-facing tool definitions and bridges
           ├── workspaces/                launcher, PTYs, templates, adapters, issues,
           │   │                          schedules, CLI shims, file/git operations
          PATCH
          rm -f .github/workflows/land-polymarket-docs.yml
          rmdir .github/workflows 2>/dev/null || true
          git config user.name "xhrissboost"
          git config user.email "nintendo.xhris@gmail.com"
          git add -A
          git commit -m "docs(polymarket): record the public CLOB path in the owner guides"
          git push
