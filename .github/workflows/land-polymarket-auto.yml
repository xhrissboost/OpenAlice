name: land-polymarket-auto
on:
  push:
    branches: [cursor/polymarket-clob-f004]
    paths:
      - .github/workflows/land-polymarket-auto.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/polymarket-clob-f004
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - name: Apply auto-trade patch and remove the lander
        run: |
          set -euo pipefail
          expected=d155b22d7d6ca9a3d8b33cb360ca3262a0ed060856b6628dd5c6a7cb6ad23b8b
          actual=$(sha256sum .github/polymarket-land/auto.patch.gz.b64 | awk '{print $1}')
          if [ "$actual" != "$expected" ]; then
            echo "patch checksum mismatch: $actual"
            exit 1
          fi
          base64 -d .github/polymarket-land/auto.patch.gz.b64 | gzip -d > /tmp/auto.patch
          git apply --check /tmp/auto.patch
          git apply /tmp/auto.patch
          rm -rf .github/polymarket-land .github/workflows/land-polymarket-auto.yml
          git config user.name "xhrissboost"
          git config user.email "nintendo.xhris@gmail.com"
          git add -A
          git commit -m "feat(polymarket): submit CLOB orders when auto trading is enabled" -m "Auto mode stays off unless POLYMARKET_AUTO_TRADE or agent.polymarketAutoTrade is set. When it is on, the planner signs and posts; missing credentials fail closed and nothing is sent."
          git push origin HEAD:cursor/polymarket-clob-f004
